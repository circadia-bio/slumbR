url: https://slumbr.circadia-lab.uk

template:
  bootstrap: 5
  bslib:
    # ── Colours ──────────────────────────────────────────────────────────────
    bg:              "#EEF5FF"          # app background
    fg:              "#1E3A5F"          # deep navy  – body text & headings
    primary:         "#4A7BB5"          # blue       – links, buttons, navbar
    secondary:       "#94A3B8"          # slate      – muted text, meta
    success:         "#4A7BB5"
    info:            "#C8DFF5"          # light-blue – callout bg
    warning:         "#E07A20"          # orange     – badges, section accents
    danger:          "#C0392B"

    # ── Fonts ─────────────────────────────────────────────────────────────────
    base_font:       {google: "Afacad"}
    heading_font:    {google: "Livvic"}
    code_font:       {google: "JetBrains Mono"}

    # ── Typography ────────────────────────────────────────────────────────────
    font-size-base:  "1rem"
    headings-font-weight: 700

    # ── Cards / surfaces ──────────────────────────────────────────────────────
    card-bg:         "#FFFFFF"
    card-border-color: "#E2EAF4"
    card-border-radius: "0.75rem"

    # ── Code blocks ───────────────────────────────────────────────────────────
    pre-bg:          "#1E3A5F"
    pre-color:       "#EEF5FF"

  includes:
    in_header: |
      <!-- slumbR custom CSS -->
      <style>
        /* ── Navbar ── */
        .navbar {
          background-color: #1E3A5F !important;
          border-bottom: 2px solid #4A7BB5;
        }
        .navbar .navbar-brand,
        .navbar-nav .nav-link,
        .navbar-nav .nav-link:hover,
        .navbar .navbar-toggler-icon,
        .navbar form .btn {
          color: #EEF5FF !important;
        }
        .navbar-nav .nav-link:hover { opacity: 0.8; }
        .navbar-nav .nav-link.active {
          color: #EEF5FF !important;
          border-bottom: 2px solid #E07A20;
        }
        .navbar small.nav-text { color: #E07A20 !important; }

        /* ── Sidebar TOC links — force navy, never light ── */
        .sidebar .nav-link,
        .sidebar a,
        #toc a,
        #toc .nav-link {
          color: #1E3A5F !important;
        }
        .sidebar .nav-link:hover,
        .sidebar a:hover,
        #toc a:hover {
          color: #4A7BB5 !important;
        }
        .sidebar .nav-link.active,
        #toc .nav-link.active {
          color: #4A7BB5 !important;
          border-left: 2px solid #E07A20;
          font-weight: 600;
        }

        /* ── Kill all text-muted on light backgrounds ── */
        .text-muted { color: #4A7BB5 !important; }

        /* ── Sidebar border ── */
        .sidebar { border-left: 3px solid #4A7BB5; padding-left: 1rem; }

        /* ── Reference index section headers ── */
        .reference-index h2 {
          color: #E07A20;
          font-size: 0.8rem;
          text-transform: uppercase;
          letter-spacing: 0.08em;
        }

        /* ── Inline code ── */
        code { color: #4A7BB5; background: #E2EAF4;
          border-radius: 4px; padding: 0.1em 0.35em; }

        /* ── Footer ── */
        .footer { background: #1E3A5F; color: #94A3B8; padding: 1.5rem 0; }
        .footer a { color: #C8DFF5; }

        /* ── Search ── */
        #search-input { border-color: #4A7BB5; }
      </style>

home:
  title: "slumbR — R tools for sleep diary research"
  description: >
    An R package for processing, scoring, and visualising sleep diary data
    collected with the Sleep Diaries app. Built by the Circadia Lab at
    Northumbria University.
  links:
  - text: Sleep Diaries app
    href: https://sleepdiaries.circadia-lab.uk
  - text: Circadia Lab
    href: https://circadia-lab.uk
  sidebar:
    structure: [links, license, community, citation, authors, dev]

navbar:
  structure:
    left:  [intro, reference, articles, tutorials, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/getting-started.html
    github:
      icon: fab fa-github
      href: https://github.com/circadia-bio/slumbR
      aria-label: GitHub

reference:
- title: "Import & tidy"
  desc: "Read and clean data exported from the Sleep Diaries app."
  contents:
  - starts_with("read_")
  - starts_with("tidy_")

- title: "Compute"
  desc: "Calculate sleep variables from diary entries."
  contents:
  - starts_with("compute_")

- title: "Questionnaires"
  desc: "Score validated one-time questionnaires (ESS, ISI, PSQI, MEQ, …)."
  contents:
  - starts_with("score_")
  - starts_with("available_")

- title: "Datasets"
  desc: "Example data included with the package."
  contents:
  - diary_long
  - diary_wide
  - study_summary

- title: "Package"
  desc: "Package-level documentation."
  contents:
  - starts_with("slumbR")

articles:
- title: "Getting started"
  navbar: ~
  contents:
  - getting-started

news:
  releases:
  - text: "Changelog"
    href: news/index.html

authors:
  Lucas França:
    href: https://orcid.org/0000-0003-0853-1319
  Mario Leocadio-Miguel:
    href: https://orcid.org/0000-0002-7248-3529

footer:
  structure:
    left: [package, developed_by]
    right: [built_with]
  components:
    package: >
      **slumbR** — Circadia Lab, Northumbria University.
    developed_by: >
      Lucas França & Mario Leocadio-Miguel.
